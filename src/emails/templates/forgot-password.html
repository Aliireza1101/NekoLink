
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>Reset Your Password</title>
</head>
<body style="margin:0;padding:0;background-color:#0c0d12;font-family:Arial,Helvetica,sans-serif;color:#f4f4f5;">

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
    style="background-color:#0c0d12;padding:40px 16px;">
    <tr>
      <td align="center">

        <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
          style="max-width:520px;background-color:#12141c;border:1px solid #262936;border-radius:16px;">

          <!-- Lock icon -->
          <tr>
            <td align="center" style="padding:40px 32px 0;">
              <div style="display:inline-block;background-color:#22213b;border-radius:50%;padding:18px;font-size:28px;line-height:1;">
                &#128274;
              </div>
            </td>
          </tr>

          <!-- Main content -->
          <tr>
            <td align="center" style="padding:24px 32px 12px;">

              <h1 style="margin:0 0 18px;font-size:28px;line-height:1.3;font-weight:700;color:#f4f4f5;">
                Reset Your Password
              </h1>

              <p style="margin:0;font-size:15px;line-height:1.8;color:#a1a6b7;">
                We received a request to reset the password
                for your account. Click the button below to
                create a new password.
              </p>

            </td>
          </tr>

          <!-- Reset button -->
          <tr>
            <td align="center" style="padding:28px 32px 20px;">
              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  <td align="center" bgcolor="#6558f5" style="border-radius:9px;">
                    <a href="{{resetUrl}}"
                      style="display:inline-block;padding:16px 34px;color:#ffffff;font-size:15px;font-weight:bold;text-decoration:none;border-radius:9px;">
                      Reset Password &rarr;
                    </a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Expiration -->
          <tr>
            <td align="center" style="padding:0 32px 28px;">
              <p style="margin:0;font-size:13px;line-height:1.7;color:#858ba0;">
                This link expires in
                <strong style="color:#c6c9d5;">15 minutes</strong>
                for your security.
              </p>
            </td>
          </tr>

          <!-- Security notice -->
          <tr>
            <td style="padding:0 28px 36px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                style="background-color:#191b25;border:1px solid #292c39;border-radius:10px;">
                <tr>
                  <td style="padding:18px;">
                    <p style="margin:0 0 8px;font-size:14px;font-weight:bold;color:#e4e5ec;">
                      Didn't request this?
                    </p>
                    <p style="margin:0;font-size:13px;line-height:1.8;color:#a1a6b7;">
                      You can safely ignore this email.
                      Your account will remain secure.
                    </p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>

</body>
</html>
